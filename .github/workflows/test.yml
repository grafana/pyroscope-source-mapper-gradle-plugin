name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        java-version: [11, 17, 21]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

    - name: Run tests
      run: ./gradlew test --stacktrace

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.os }}-java${{ matrix.java-version }}
        path: build/reports/tests/

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

    - name: Build plugin
      run: ./gradlew build --stacktrace

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plugin-jar
        path: build/libs/*.jar

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

    - name: Test example project
      run: |
        cd example
        ./gradlew generatePyroscopeSourceMap --stacktrace
        
    - name: Verify output file exists
      run: |
        if [ ! -f example/.pyroscope.yaml ]; then
          echo "Error: .pyroscope.yaml file was not generated"
          exit 1
        fi
        echo "✓ .pyroscope.yaml file generated successfully"

    - name: Display generated file
      run: |
        echo "Generated .pyroscope.yaml:"
        cat example/.pyroscope.yaml

    - name: Upload generated file
      uses: actions/upload-artifact@v4
      with:
        name: example-pyroscope-yaml
        path: example/.pyroscope.yaml
